<!DOCTYPE HTML>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
      content="Rafting Site landing page, information basic trip summaries and enrollment strategies.">
    <meta name="author" content="Juan Manuel Pantano Cordoba">
    <link rel="stylesheet" href="styles/rafting.css">
    <title>WhiteWater</title>
</head>

<body>
    <header>
        <img src="images/z-crossedoars.jpeg" alt="Logo of Rafting Company">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>
    <main>
        <div class="hero">
            <img src="images/iadventure.jpg" alt="Rafting activity">
            <h1>Are you ready for adventure? 🤠</h1>
        </div>
        <section class="news">

            <form class="newsletter" action="/subscribe" method="post">
                <h2>🗺️ Get to know our latest destinations </h2>
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required />

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required />

                <button type="submit">Subscribe</button>
            </form>
            <figure>
                <img src="images/pacuareriver.jpg" alt="Pacuare River">
                <figcaption>Costa Rica</figcaption>
            </figure>
            <img src="images/sign.png" alt="" class="sign">
            <figure>
                <img src="images/grandcanyon.jpg" alt="Grand Canyon River">
                <figcaption>USA</figcaption>
            </figure>

            <a href="trips.html">Go to Trips! ⛵</a>
        </section>
        <section class="adventures index">
            <h2>Not just rafting!</h2>
            <figure>
                <img src="images/campfire.jpg" alt="River">
                <figcaption>
                    <h3>Overnight Camping</h3>We provide tents, sleeping bags, sleeping pads
                    and camping chairs for a full wild experience!
                </figcaption>
            </figure>
            <figure>
                <img src="images/lunch.jpg" alt="River">
                <figcaption>
                    <h3>Meals</h3>On site meals on most river trips which take up 1 or more full
                    days!
                </figcaption>
            </figure>
            <figure>
                <img src="images/photography.jpg" alt="River">
                <figcaption>
                    <h3>Photography</h3>High-action photos of guests in rapids, available for
                    purchase after the trip!
                </figcaption>
            </figure>
        </section>
    </main>
    <footer>
        <p> &copy; 2026 WhiteWater Rafting 🚣‍♂️ Juan Manuel Pantano</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebooklogo.png" alt="Facebook Logo">
            </a>
            <a href="https://linkedin.com">
                <img src="images/linkedin.png" alt="Linkedin Logo">
            </a>
            <a href="https://instagram.com">
                <img src="images/iglogo.png" alt="Instagram Logo">
            </a>
        </nav>
    </footer>
</body>

</html>
