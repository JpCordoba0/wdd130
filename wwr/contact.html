<!DOCTYPE HTML>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
      content="Rafting Site, contact information of the staff and a contact form to ask questions about the company">
    <meta name="author" content="Juan Manuel Pantano Cordoba">
    <link rel="stylesheet" href="styles/rafting.css">
    <title>Contact Us WhiteWater</title>
</head>

<body>
    <header>
        <img src="images/z-crossedoars.jpeg" alt="Logo of Rafting Company">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>
    <main>
        <div class="contact">
            <h1>White Water Rafting Company</h1>
            <p>123 Main River Street</p>
            <p>Kolob, California</p>
            <p>+1 999 999 999</p>
            <p>info@whitewater.com</p>
        </div>
        <section class="form">
            <iframe
              src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d25244.35437703281!2d-122.07947642336796!3d38.25437924641604!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1ses!2sar!4v1774897807540!5m2!1ses!2sar"
              width="400" height="300" allowfullscreen="" loading="lazy"
              referrerpolicy="no-referrer-when-downgrade"></iframe>
            <form>
                <label for="name">Name</label>
                <input type="text" id="name" name="name" placeholder="Name">
                <label for="email">Email</label>
                <input type="email" name="email" id="email" placeholder="Email">

                <label>Message Purpose</label>
                <fieldset id="purpose">
                    <input type="radio" id="general" name="purpose" value="general">
                    <label for="general">General Inquiry</label>

                    <input type="radio" id="reservation" name="purpose" value="reservation">
                    <label for="reservation">Reservation Question</label>

                    <input type="radio" id="suggestion" name="purpose" value="suggestion">
                    <label for="suggestion">Website Suggestion</label>
                </fieldset>

                <label for="message">Message</label>
                <textarea id="message" name="message" placeholder="Type here"></textarea>


                <label for="subscribe"><input type="checkbox" id="subscribe" name="subscribe">Please
                    subscribe me to the monthly newsletter</label>
                <button type="submit">Get in touch!</button>
            </form>
        </section>

        <section class="staff">
            <h2>We are here to serve!</h2>
            <figure>
                <img src="images/mary.jpeg" alt="Mary Carpinter">
                <figcaption>Mary Carpinter<br>Owner</figcaption>
            </figure>
            <figure>
                <img src="images/jhon.jpg" alt="Jhon Whitmer">
                <figcaption>John Whitmer<br>Advanced Instructor</figcaption>
            </figure>
            <figure>
                <img src="images/phil.webp" alt="Phill Hamburger">
                <figcaption>Phill Hamburguer<br>Safety Specialist</figcaption>
            </figure>
        </section>
    </main>
    <footer>
        <p> &copy; 2026 WhiteWater Rafting 🚣‍♂️ Juan Manuel Pantano</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebooklogo.png" alt="Facebook Logo">
            </a>
            <a href="https://linkedin.com">
                <img src="images/linkedin.png" alt="Linkedin Logo">
            </a>
            <a href="https://instagram.com">
                <img src="images/iglogo.png" alt="Instagram Logo">
            </a>
        </nav>
    </footer>
</body>

</html>
